name: Demo Workflow
on: 
  pull_request:
    types:
      - opened
      - edited
    branches:
      - main
  workflow_dispatch:
  push:
    branches:
      - main
      - 'dev-*'  # Matches dev-feature, dev-bugfix, etc.
      - 'dev/**' # Matches any branch under dev/ directory den/feature, dev/bugfix/subfix, etc.
    paths-ignore:
      - 'github/workflows/**'
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Output event data
        run: echo "${{ toJSON(github.event) }}"
      - name: Get code
        uses: actions/checkout@v3
      - name: Install dependencies
        run: npm ci
      - name: Test code
        run: npm run test
      - name: Build code
        run: npm run build
      - name: Deploy project
        run: echo "Deploying..."